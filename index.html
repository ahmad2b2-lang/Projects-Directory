<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f6f1e7">
<title>Projects Directory</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="All of Ahmad's live web apps and games in one place.">

<style>
/* Light theme only, by request: no dark mode, not even following the phone setting. */
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#1d2420; --muted:#5f6a63; --line:#e4dccb;
  --accent:#1f4d3f; --gold:#e7a83e;
  --r:18px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.5 "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:1040px; margin:0 auto; padding:0 16px 56px}

header{padding:44px 0 22px}
.mark{display:flex; align-items:center; gap:10px; color:var(--accent); font-weight:600; font-size:14px; letter-spacing:.04em; text-transform:uppercase}
.mark svg{width:28px;height:28px}
h1{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:clamp(34px,8vw,58px); line-height:1.02; letter-spacing:-.02em;
  margin:14px 0 10px;
}
h1 em{font-style:normal; color:var(--accent); background:linear-gradient(transparent 62%, #f3d79c 62%)}
.lede{color:var(--muted); max-width:560px; margin:0}

.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:26px 0 20px}
.search{
  flex:1 1 220px; display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 16px;
}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0; outline:0; background:transparent; font:inherit; color:var(--ink); width:100%}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font:500 14px/1 "Inter",sans-serif; color:var(--ink);
  background:transparent; border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

.count{font-size:13px; color:var(--muted); margin:0 0 12px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:16px; display:flex; flex-direction:column; gap:12px;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-2px); box-shadow:0 12px 26px -18px rgba(31,77,63,.45)}
.top{display:flex; gap:14px; align-items:flex-start}
.ico{
  flex:none; width:52px; height:52px; border-radius:14px; display:grid; place-items:center;
  background:var(--bg); color:var(--fg);
}
.ico svg{width:26px; height:26px}
.info{min-width:0; flex:1}
.info h2{font-family:"Bricolage Grotesque",sans-serif; font-size:20px; line-height:1.15; margin:0; font-weight:700}
.info .ar{font-family:"IBM Plex Sans Arabic",sans-serif; color:var(--muted); font-size:14px; margin-top:2px; text-align:left}
.meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.pill{font:500 12px/1 "Inter","IBM Plex Sans Arabic",sans-serif; padding:5px 8px; border-radius:999px; background:#f1ebde; color:var(--ink)}
.pill.hid{background:#ece9f7; color:#4b4689}
.pill.date{background:transparent; border:1px solid var(--line); color:var(--muted)}
.card p{margin:0; color:var(--muted); font-size:15px}
.actions{display:flex; gap:8px; margin-top:auto}
.btn{
  flex:1; text-align:center; text-decoration:none; font:600 14px/1 "Inter",sans-serif;
  padding:12px 10px; border-radius:12px; border:1px solid var(--line); color:var(--ink); background:#fff;
}
.btn.go{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

.pill.priv{background:#1f4d3f; color:#fff}
#vault{margin-top:28px}
.vault-closed{
  width:100%; display:flex; align-items:center; gap:14px; text-align:left; cursor:pointer;
  background:#fffdf8; border:1.5px dashed #b9ae95; border-radius:var(--r); padding:16px; font:inherit; color:var(--ink);
}
.vinfo{flex:1; display:flex; flex-direction:column}
.vinfo b{font-family:"Bricolage Grotesque",sans-serif; font-size:19px}
.vinfo small{color:var(--muted); font-size:14px}
.vgo{background:var(--accent); color:#fff; font-weight:600; font-size:14px; padding:10px 14px; border-radius:12px}
.vault-open{background:#eef3ee; border:1px solid #cfdccf; border-radius:22px; padding:14px}
.vhead{display:flex; justify-content:space-between; align-items:center; margin:2px 4px 12px}
.vt{display:flex; align-items:center; gap:8px; font-family:"Bricolage Grotesque",sans-serif; font-weight:700; font-size:18px; color:var(--accent)}
.vt svg{width:20px;height:20px}
.vlock{font:600 13px/1 "Inter",sans-serif; background:#fff; border:1px solid #cfdccf; border-radius:999px; padding:8px 12px; cursor:pointer; color:var(--ink)}
.vnone{color:var(--muted); margin:8px 4px}
.pad{position:fixed; inset:0; background:rgba(29,36,32,.35); display:grid; place-items:end center; z-index:10; padding:16px}
.pad[hidden]{display:none}
.pad-box{position:relative; width:100%; max-width:360px; background:#fffdf8; border-radius:24px; padding:24px 20px 20px; text-align:center;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.35); margin-bottom:env(safe-area-inset-bottom)}
@media (min-width:600px){.pad{place-items:center}}
.pad-x{position:absolute; top:10px; right:12px; border:0; background:none; font-size:26px; color:var(--muted); cursor:pointer; line-height:1}
.pad-ico{width:48px;height:48px;margin:0 auto 8px;border-radius:14px;background:#1f4d3f;color:#f6f1e7;display:grid;place-items:center}
.pad-ico svg{width:24px;height:24px}
.pad-box h3{margin:0; font-family:"Bricolage Grotesque",sans-serif; font-size:21px}
.pad-sub{margin:2px 0 14px; color:var(--muted); font-size:14px}
.dots{display:flex; justify-content:center; gap:10px; min-height:14px}
.dots span{width:12px;height:12px;border-radius:50%;border:2px solid #b9ae95}
.dots span.on{background:var(--accent); border-color:var(--accent)}
.pad-msg{min-height:20px; margin:10px 0 6px; font-size:14px; color:#b4442f}
.keys{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.keys button{font:600 22px/1 "Inter",sans-serif; padding:16px 0; border-radius:16px; border:1px solid var(--line); background:#fff; color:var(--ink);
  cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none}
.keys button:active{background:#f1ebde; transform:scale(.97)}
.keys .ok{font-size:15px; background:var(--accent); color:#fff; border-color:var(--accent)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.empty{display:none; text-align:center; color:var(--muted); padding:40px 0}
footer{margin-top:44px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1f4d3f"/><rect x="14" y="14" width="15" height="15" rx="4" fill="#f6f1e7"/><rect x="35" y="14" width="15" height="15" rx="4" fill="#e7a83e"/><rect x="14" y="35" width="15" height="15" rx="4" fill="#e7a83e"/><rect x="35" y="35" width="15" height="15" rx="4" fill="#f6f1e7"/></svg>
      ahmad2b2-lang
    </div>
    <h1>Everything we've <em>shipped</em>.</h1>
    <p class="lede">Games, readers and small tools, all live on the web and made for phones. Newest first. Tap Open to try one.</p>
  </header>

  <div class="bar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
  </div>

  <p class="count" id="count"></p>
  <main class="grid" id="grid"></main>
  <p class="empty" id="empty">No project matches that search.</p>
  <section id="vault" aria-label="Private projects"></section>

  <div class="pad" id="pad" hidden>
    <div class="pad-box" id="padBox" role="dialog" aria-modal="true" aria-labelledby="padT">
      <button class="pad-x" id="padClose" type="button" aria-label="Close">×</button>
      <div class="pad-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
      <h3 id="padT">Private projects</h3>
      <p class="pad-sub">Enter the passcode</p>
      <div class="dots" id="dots"></div>
      <p class="pad-msg" id="padMsg" aria-live="polite"></p>
      <div class="keys" id="keys">
        <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
        <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
        <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
        <button type="button" data-k="del" aria-label="Delete">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="go" class="ok">Unlock</button>
      </div>
    </div>
  </div>

  <footer>
    <span>Updated <span id="yr"></span> · Built with Claude</span>
    <a href="https://github.com/ahmad2b2-lang">github.com/ahmad2b2-lang</a>
  </footer>
</div>

<script>
const USER = "ahmad2b2-lang";
const site = (repo, path = "") => `https://${USER}.github.io/${repo}/${path}`;
const code = repo => `https://github.com/${USER}/${repo}`;

/* ------------------------------------------------------------------
   THE LIST. To add a project, copy one entry and change it.
   released: the date it went live (YYYY-MM-DD); the list sorts by it, newest first.
   type: "Game" | "Reading" | "Tool" | "Tribute"
   icon: a key from ICONS below; bg: the picture's background colour.
------------------------------------------------------------------- */
const PROJECTS = [
  { name: "Majlis", ar: "تحضير الحديث مع الأصدقاء", type: "Tool", lang: "EN · عربي", released: "2026-10-28", hidden: true,
    desc: "Get good conversations ready before meeting friends. Locked with a PIN.",
    url: site("Farewell", "majlis-7q/"), repo: "Farewell", icon: "chat", bg: "#e6e4f3", fg: "#4b4689" },
  { name: "Hadith Card Maker", ar: "صانع بطاقات الأحاديث", type: "Tool", lang: "عربي", released: "2026-10-26", hidden: true,
    desc: "Pick a template, type the text, and save a card for WhatsApp status or Instagram stories.",
    url: site("Teacher_Day", "hadith-cards/"), repo: "Teacher_Day", icon: "cards", bg: "#f5e7d3", fg: "#8a5a22" },
  { name: "Reading Quran", ar: "قراءة القرآن", type: "Reading", lang: "عربي", released: "2026-10-28",
    desc: "Read a few pages at a time, and pick up exactly where you stopped.",
    url: site("Reading-Quraan"), repo: "Reading-Quraan", icon: "quran", bg: "#e3efdc", fg: "#2e6b48" },
  { name: "Teacher Day", ar: "يوم المعلم", type: "Tribute", lang: "عربي", released: "2026-10-25",
    desc: "A thank-you journey for a teacher: a quiz, a certificate and a gift.",
    url: site("Teacher_Day"), repo: "Teacher_Day", icon: "teacher", bg: "#dde8e1", fg: "#2f5546" },
  { name: "Night Train to Mecca", ar: "قطار الليل إلى مكة", type: "Game", lang: "EN · 中文", released: "2026-10-22",
    desc: "A Chinese student falls asleep on a night train and wakes somewhere unexpected.",
    url: site("Hamood-s-Game"), repo: "Hamood-s-Game", icon: "train", bg: "#dfe6f3", fg: "#2f4a7a" },
  { name: "Qibla Compass", ar: "اتجاه القبلة", type: "Tool", lang: "EN", released: "2026-10-21",
    desc: "Finds your location and points the way to the Kaaba.",
    url: site("The-Forty-Hadith", "qibla.html"), repo: "The-Forty-Hadith", icon: "compass", bg: "#f3ead6", fg: "#8a5a22" },
  { name: "The Forty Hadith", ar: "شرح الأربعون حديثاً للناشئة", type: "Reading", lang: "عربي", released: "2026-10-20",
    desc: "Illustrated stories for young readers, played as a level-by-level journey.",
    url: site("The-Forty-Hadith"), repo: "The-Forty-Hadith", icon: "book", bg: "#e8efe4", fg: "#3d8159" },
];

/* Private projects: stored encrypted. Only the passcode can open them.
   To change this list, ask Claude to re-encrypt it (the passcode is never written in this file). */
const VAULT = { salt: "tdOWeFr8wLHopPTTPHCufw==", iv: "N9yJOSZfSqlFYRhj", iter: 310000, data: "zA0J4oUIYqSBSL6xCo7a1k8iuo1BZsUAVUx0VYrqUxOVy6Tm/2BAJ28rthw2Sc4huYB2qMejM7Z2GbZGmrwfdFn1bz3H3g5CNy2DIaPtDqH3P+Fd1A/g1iX6ZuFbrDivI+grM9aELO2fq/Y8WNJ5W30GoH+kCaCFcHgGtXnZXAOLlsCRHP3oXsy634Kb4hDKima03qtn0XBzAaUg+7rCG6TPIfJqEkb8idT0QsqHQxQqkMxg6yrjMyVQYseQb4jTao6KlL4vhSPk6xVYJC1dxkU1fmeIZ3AML0jUKxe3S/jt+QhW8Q5Haz3amnyi/QoIaKj9v8QZNz5uygUOKX4xjL4rQCTxd4p7cN8zviINNsDPHZBrpTlYyL3jaWodKP8qw/RwTTFXau8iPiNJqAT9OfoXdZshyWq1ZbH/lPRobDZFztyWzRoxKGregxf/t48xEb9DSynEeNYM2aK/lD4B2LNiymgTl7c4zyvKRlkSz7M7aP6mtzLl8/iIP6zERlbfgHVNAT0GXIizPa/q2BOpBhhw4R3y2iAMol/EAxHdWNDSnuUTVbPgMAFHaWt1fB4ozEJeqb7QMb5WnUgSprDvKP9PPfR9kAT1tcScvA+J6wGROtp92hqDsN2z6PL4b4w1QjPJL7qzRqDJso2GqwqUTPqU5x4NxgP6gdlwV2tvRXVspJsvHsIKMCyqLEp+4MJfREDX+YoVMIwBbyuiafeFlU9azL+TfeiTPUSDCpe6n2Af1C2i9DybDOjRQO4fAosCrJdDwGvEfChLYcrVUkmhSt3cxCl3sE997fMGJcBZL1HDuCTOntCNfBcKmCPK3AMkfjONVHCnB8YxXtQAb8V6KESCM95+mxez0KduKhkvirbgcwXPIypVJITD4590T2CVQ3/vHJwDlFShaNx37F7KxdhtAcjfMzSXPe0Lbl1xn0edqug1sTTBlVxYxzYIV8jKn9LV/sSWEb5ITri18rnS0QJvbc3zDiXfyuLye7qYzfbCaI4rr/MIOEr4HqepabtrDMDMjkJCfBi18Wm/Wf9Rne59WWDDhgtnTjDUqJyDqfCw1n0Vf3FCF0gV4qQuM+JYJlGN7jmTbdkVnB2G4Ht41G6qi9SwTdFGVOTR/fW/onYbWvGT22a3+ZcZ3F874hpldKaPb5frzuwWbqvnsFxqb5pKKhtNVbFvcK8=", count: 3 };

/* Simple line icons (24x24, stroke = currentColor). */
const I = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS = {
  chat:    I(`<path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/>`),
  cards:   I(`<rect x="8" y="2" width="13" height="17" rx="2"/><path d="M5 5H4a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-1"/><path d="m14.5 7 .7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z"/><path d="M11 14h7"/>`),
  quran:   I(`<path d="M12 7v13"/><path d="M3 18a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>`),
  teacher: I(`<path d="M21.4 10.9a1 1 0 0 0 0-1.8l-8.6-4a2 2 0 0 0-1.6 0L2.6 9.1a1 1 0 0 0 0 1.8l8.6 4a2 2 0 0 0 1.6 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>`),
  train:   I(`<rect x="4" y="3" width="16" height="16" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><path d="M8 15h.01"/><path d="M16 15h.01"/>`),
  compass: I(`<circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2.1 6.3-6.3 2.1 2.1-6.3z"/>`),
  book:    I(`<path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="m12 6 .9 1.8 2 .3-1.4 1.4.3 2-1.8-.9-1.8.9.3-2-1.4-1.4 2-.3z"/>`),
  castle:  I(`<path d="M22 20v-9H2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2Z"/><path d="M18 11V4H6v7"/><path d="M15 22v-4a3 3 0 0 0-6 0v4"/><path d="M22 11V9"/><path d="M2 11V9"/><path d="M6 4V2"/><path d="M18 4V2"/><path d="M10 4V2"/><path d="M14 4V2"/>`),
  lock:    I(`<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><path d="M12 15v3"/>`),
  sword:   I(`<path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/>`),
};

const TYPES = ["All", ...new Set(PROJECTS.map(p => p.type))];
let active = "All";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

$("chips").innerHTML = TYPES.map(t =>
  `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === active}">${esc(t)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.t;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.t === active));
  render();
});
$("q").addEventListener("input", render);
$("yr").textContent = new Date().getFullYear();

const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = [...PROJECTS].sort((a, b) => b.released.localeCompare(a.released)).filter(p =>
    (active === "All" || p.type === active) &&
    (!q || [p.name, p.ar, p.desc, p.type].join(" ").toLowerCase().includes(q)));
  $("grid").innerHTML = list.map(cardHTML).join("");
  $("count").textContent = `${list.length} public project${list.length === 1 ? "" : "s"}`;
  $("empty").style.display = list.length ? "none" : "block";
  renderVault(q);
}
function cardHTML(p) { return `
    <article class="card">
      <div class="top">
        <div class="ico" style="--bg:${p.bg};--fg:${p.fg}">${ICONS[p.icon] || ""}</div>
        <div class="info">
          <h2>${esc(p.name)}</h2>
          ${p.ar ? `<div class="ar" dir="rtl">${esc(p.ar)}</div>` : ""}
          <div class="meta">
            <span class="pill">${esc(p.type)}</span>
            ${p.lang ? `<span class="pill">${esc(p.lang)}</span>` : ""}
            ${p.hidden ? `<span class="pill hid">Hidden</span>` : ""}
            ${p.private ? `<span class="pill priv">Private</span>` : ""}
            <span class="pill date">${fmt(p.released)}</span>
          </div>
        </div>
      </div>
      <p>${esc(p.desc)}</p>
      <div class="actions">
        <a class="btn go" href="${p.url}">Open</a>
        ${p.repo ? `<a class="btn" href="${code(p.repo)}">Code</a>` : ""}
      </div>
    </article>`;
}

/* ---------- Private container ---------- */
let privateList = null, pin = "";
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(code) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(VAULT.iv) }, key, b64d(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}
function renderVault(q = $("q").value.trim().toLowerCase()) {
  const v = $("vault");
  if (!privateList) {
    v.innerHTML = `<button class="vault-closed" type="button" id="vaultBtn">
      <span class="ico" style="--bg:#1f4d3f;--fg:#f6f1e7">${ICONS.lock}</span>
      <span class="vinfo"><b>Private projects</b><small>${VAULT.count} projects · enter the passcode to open</small></span>
      <span class="vgo">Unlock</span></button>`;
    $("vaultBtn").onclick = showPad;
    return;
  }
  const list = privateList.filter(p => (active === "All" || p.type === active) &&
    (!q || [p.name, p.ar, p.desc, p.type].join(" ").toLowerCase().includes(q)));
  v.innerHTML = `<div class="vault-open">
      <div class="vhead"><span class="vt">${ICONS.lock}Private projects</span>
        <button type="button" class="vlock" id="relock">Lock</button></div>
      <div class="grid">${list.map(cardHTML).join("") || `<p class="vnone">No private project matches.</p>`}</div>
    </div>`;
  $("relock").onclick = () => { privateList = null; renderVault(); };
}
function showPad() { pin = ""; drawDots(); $("padMsg").textContent = ""; $("pad").hidden = false; }
function hidePad() { $("pad").hidden = true; pin = ""; }
function drawDots() { $("dots").innerHTML = Array.from({ length: Math.max(7, pin.length) }, (_, i) => `<span class="${i < pin.length ? "on" : ""}"></span>`).join(""); }
async function tryPin() {
  if (!pin) return;
  $("padMsg").textContent = "Checking…";
  try {
    const list = await openVault(pin);
    privateList = list.map(p => ({ ...p, private: true })).sort((a, b) => b.released.localeCompare(a.released));
    hidePad(); renderVault();
  } catch {
    $("padMsg").textContent = "Wrong passcode"; pin = ""; drawDots();
    $("padBox").classList.remove("shake"); void $("padBox").offsetWidth; $("padBox").classList.add("shake");
  }
}
$("keys").addEventListener("click", e => {
  const k = e.target.closest("button")?.dataset.k; if (!k) return;
  if (navigator.vibrate) navigator.vibrate(8);
  if (k === "del") pin = pin.slice(0, -1);
  else if (k === "go") return tryPin();
  else if (pin.length < 12) pin += k;
  $("padMsg").textContent = ""; drawDots();
});
$("padClose").onclick = hidePad;
$("pad").addEventListener("click", e => { if (e.target.id === "pad") hidePad(); });
document.addEventListener("keydown", e => {
  if ($("pad").hidden) return;
  if (/^[0-9]$/.test(e.key) && pin.length < 12) { pin += e.key; drawDots(); }
  else if (e.key === "Backspace") { pin = pin.slice(0, -1); drawDots(); }
  else if (e.key === "Enter") tryPin();
  else if (e.key === "Escape") hidePad();
});
render();
</script>
</body>
</html>
