<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#f6f1e7">
<title>Projects Directory</title>
<meta name="description" content="All of Ahmad's live web apps and games in one place.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f4d3f'/%3E%3Crect x='14' y='14' width='15' height='15' rx='4' fill='%23f6f1e7'/%3E%3Crect x='35' y='14' width='15' height='15' rx='4' fill='%23e7a83e'/%3E%3Crect x='14' y='35' width='15' height='15' rx='4' fill='%23e7a83e'/%3E%3Crect x='35' y='35' width='15' height='15' rx='4' fill='%23f6f1e7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Light theme only, by request: no dark mode, not even following the phone setting. */
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#1d2420; --muted:#5f6a63; --line:#e4dccb;
  --accent:#1f4d3f; --gold:#e7a83e;
  --r:18px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.5 "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:1040px; margin:0 auto; padding:0 16px 56px}

header{padding:44px 0 22px}
.mark{display:flex; align-items:center; gap:10px; color:var(--accent); font-weight:600; font-size:14px; letter-spacing:.04em; text-transform:uppercase}
.mark svg{width:28px;height:28px}
h1{
  font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
  font-size:clamp(34px,8vw,58px); line-height:1.02; letter-spacing:-.02em;
  margin:14px 0 10px;
}
h1 em{font-style:normal; color:var(--accent); background:linear-gradient(transparent 62%, #f3d79c 62%)}
.lede{color:var(--muted); max-width:560px; margin:0}

.bar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:26px 0 20px}
.search{
  flex:1 1 220px; display:flex; align-items:center; gap:8px;
  background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 16px;
}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0; outline:0; background:transparent; font:inherit; color:var(--ink); width:100%}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font:500 14px/1 "Inter",sans-serif; color:var(--ink);
  background:transparent; border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}

.count{font-size:13px; color:var(--muted); margin:0 0 12px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  overflow:hidden; display:flex; flex-direction:column;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{transform:translateY(-3px); box-shadow:0 14px 30px -18px rgba(31,77,63,.45)}
.art{
  aspect-ratio:16/9; display:grid; place-items:center; position:relative;
  background:var(--bg);
}
.art svg{width:46%; height:auto; max-height:78%}
.tag{
  position:absolute; top:12px; left:12px;
  font:600 11px/1 "Inter",sans-serif; letter-spacing:.06em; text-transform:uppercase;
  background:rgba(255,255,255,.85); color:var(--ink); padding:6px 9px; border-radius:999px;
}
.lang{position:absolute; top:12px; right:12px; font:500 12px/1 "IBM Plex Sans Arabic",sans-serif;
  background:rgba(255,255,255,.85); padding:6px 9px; border-radius:999px}
.body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:6px; flex:1}
.body h2{font-family:"Bricolage Grotesque",sans-serif; font-size:22px; line-height:1.15; margin:0; font-weight:700}
.body .ar{font-family:"IBM Plex Sans Arabic",sans-serif; color:var(--muted); font-size:14px; direction:rtl; text-align:left}
.body p{margin:2px 0 0; color:var(--muted); font-size:15px}
.actions{display:flex; gap:8px; margin-top:auto; padding-top:14px}
.btn{
  flex:1; text-align:center; text-decoration:none; font:600 14px/1 "Inter",sans-serif;
  padding:12px 10px; border-radius:12px; border:1px solid var(--line); color:var(--ink); background:#fff;
}
.btn.go{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--gold); outline-offset:2px}

.empty{display:none; text-align:center; color:var(--muted); padding:40px 0}
footer{margin-top:44px; padding-top:20px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1f4d3f"/><rect x="14" y="14" width="15" height="15" rx="4" fill="#f6f1e7"/><rect x="35" y="14" width="15" height="15" rx="4" fill="#e7a83e"/><rect x="14" y="35" width="15" height="15" rx="4" fill="#e7a83e"/><rect x="35" y="35" width="15" height="15" rx="4" fill="#f6f1e7"/></svg>
      ahmad2b2-lang
    </div>
    <h1>Everything we've <em>shipped</em>.</h1>
    <p class="lede">Games, readers and small tools, all live on the web and made for phones. Tap a card to open it.</p>
  </header>

  <div class="bar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search projects" aria-label="Search projects" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
  </div>

  <p class="count" id="count"></p>
  <main class="grid" id="grid"></main>
  <p class="empty" id="empty">No project matches that search.</p>

  <footer>
    <span>Updated <span id="yr"></span> · Built with Claude</span>
    <a href="https://github.com/ahmad2b2-lang">github.com/ahmad2b2-lang</a>
  </footer>
</div>

<script>
const USER = "ahmad2b2-lang";
const site = (repo, path = "") => `https://${USER}.github.io/${repo}/${path}`;
const code = repo => `https://github.com/${USER}/${repo}`;

/* ------------------------------------------------------------------
   THE LIST. To add a project, copy one entry and change it.
   type: "Game" | "Reading" | "Tool" | "Tribute"
   icon: a key from ICONS below; bg: the picture's background colour.
------------------------------------------------------------------- */
const PROJECTS = [
  { name: "Night Train to Mecca", ar: "قطار الليل إلى مكة", type: "Game", lang: "EN · 中文",
    desc: "A Chinese student falls asleep on a night train and wakes somewhere unexpected.",
    url: site("Hamood-s-Game"), repo: "Hamood-s-Game", icon: "train", bg: "#dfe6f3" },
  { name: "Endless Hope", type: "Game", lang: "عربي",
    desc: "A short turn-based battle with a gift waiting at the end.",
    url: site("EndlessHope-Game"), repo: "EndlessHope-Game", icon: "sword", bg: "#dbe9f6" },
  { name: "Four Locks", type: "Game", lang: "EN · عربي",
    desc: "A four-player dungeon adventure of locks, quiz trials and battles.",
    url: site("Farewell"), repo: "Farewell", icon: "lock", bg: "#efe3cf" },
  { name: "The Forty Hadith", ar: "شرح الأربعون حديثاً للناشئة", type: "Reading", lang: "عربي",
    desc: "Illustrated stories for young readers, played as a level-by-level journey.",
    url: site("The-Forty-Hadith"), repo: "The-Forty-Hadith", icon: "book", bg: "#e3efdc" },
  { name: "Reading Quran", ar: "قراءة القرآن", type: "Reading", lang: "عربي",
    desc: "Read a few pages at a time, and pick up exactly where you stopped.",
    url: site("Reading-Quraan"), repo: "Reading-Quraan", icon: "rehal", bg: "#e8efe4" },
  { name: "Wonderland", type: "Reading", lang: "EN · عربي",
    desc: "An illustrated children's storybook with narration.",
    url: site("Wonderland"), repo: "Wonderland", icon: "castle", bg: "#f1e4ef" },
  { name: "Qibla Compass", ar: "اتجاه القبلة", type: "Tool", lang: "EN",
    desc: "Finds your location and points the way to the Kaaba.",
    url: site("The-Forty-Hadith", "qibla.html"), repo: "The-Forty-Hadith", icon: "compass", bg: "#f3ead6" },
  { name: "Teacher Day", ar: "يوم المعلم", type: "Tribute", lang: "عربي",
    desc: "A thank-you journey for a teacher: a quiz, a certificate and a gift.",
    url: site("Teacher_Day"), repo: "Teacher_Day", icon: "board", bg: "#dde8e1" },
];

/* Hand-drawn icons, one per project. */
const ICONS = {
  train: `<svg viewBox="0 0 120 100"><circle cx="92" cy="20" r="11" fill="#e7a83e"/><circle cx="97" cy="16" r="9" fill="#dfe6f3"/><rect x="18" y="30" width="72" height="44" rx="12" fill="#2f4a7a"/><rect x="27" y="39" width="20" height="16" rx="3" fill="#fde9b5"/><rect x="53" y="39" width="28" height="16" rx="3" fill="#fde9b5"/><rect x="18" y="62" width="72" height="5" fill="#e7a83e"/><circle cx="36" cy="80" r="7" fill="#1d2420"/><circle cx="72" cy="80" r="7" fill="#1d2420"/><rect x="8" y="88" width="104" height="4" rx="2" fill="#1d2420" opacity=".35"/></svg>`,
  sword: `<svg viewBox="0 0 100 100"><path d="M50 88s-30-17-30-40a16 16 0 0 1 30-8 16 16 0 0 1 30 8c0 23-30 40-30 40z" fill="#e05a5a"/><g transform="rotate(-40 50 50)"><rect x="46" y="8" width="8" height="58" rx="2" fill="#cfd8e3" stroke="#3a4a5c" stroke-width="2"/><rect x="34" y="62" width="32" height="7" rx="3" fill="#2f4a7a"/><rect x="46" y="69" width="8" height="14" rx="2" fill="#7a5130"/></g></svg>`,
  lock: `<svg viewBox="0 0 100 100"><path d="M32 46V34a18 18 0 0 1 36 0v12" fill="none" stroke="#5b4630" stroke-width="8" stroke-linecap="round"/><rect x="22" y="44" width="56" height="44" rx="10" fill="#b8742e"/><rect x="22" y="44" width="56" height="10" rx="5" fill="#d08b3e"/><circle cx="50" cy="66" r="7" fill="#3b2a1a"/><rect x="47" y="68" width="6" height="12" rx="2" fill="#3b2a1a"/></svg>`,
  book: `<svg viewBox="0 0 110 100"><path d="M55 26c-12-8-28-9-42-6v58c14-3 30-2 42 6z" fill="#fffdf8" stroke="#2e6b48" stroke-width="3" stroke-linejoin="round"/><path d="M55 26c12-8 28-9 42-6v58c-14-3-30-2-42 6z" fill="#f2f8ee" stroke="#2e6b48" stroke-width="3" stroke-linejoin="round"/><path d="M55 26v58" stroke="#2e6b48" stroke-width="3"/><path d="M22 36h24M22 46h24M22 56h18M64 36h24M64 46h24M64 56h18" stroke="#9fc4a8" stroke-width="3" stroke-linecap="round"/><path d="M78 6l3 7 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#e7a83e"/></svg>`,
  rehal: `<svg viewBox="0 0 110 100"><path d="M20 84l35-30 35 30" fill="none" stroke="#7a5130" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 30l35 24 35-24" fill="none" stroke="#7a5130" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 54L22 31c8-9 22-12 33-5z" fill="#2e6b48"/><path d="M55 54l33-23c-8-9-22-12-33-5z" fill="#3d8159"/><circle cx="40" cy="38" r="4" fill="#e7a83e"/><circle cx="70" cy="38" r="4" fill="#e7a83e"/></svg>`,
  castle: `<svg viewBox="0 0 110 100"><path d="M86 12l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1z" fill="#e7a83e"/><circle cx="22" cy="20" r="3" fill="#e7a83e"/><rect x="22" y="44" width="66" height="44" fill="#b884b0"/><path d="M14 44l14-22 14 22z" fill="#7d4f7a"/><path d="M68 44l14-22 14 22z" fill="#7d4f7a"/><rect x="18" y="44" width="20" height="44" fill="#9c6a98"/><rect x="72" y="44" width="20" height="44" fill="#9c6a98"/><path d="M44 88V68a11 11 0 0 1 22 0v20z" fill="#4e2f4c"/><circle cx="55" cy="54" r="5" fill="#fde9b5"/></svg>`,
  compass: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="#fffdf8" stroke="#7a5130" stroke-width="5"/><circle cx="50" cy="50" r="30" fill="none" stroke="#e4dccb" stroke-width="2"/><path d="M50 18l8 32h-16z" fill="#1f4d3f"/><path d="M50 82l-8-32h16z" fill="#c9bfa9"/><circle cx="50" cy="50" r="5" fill="#7a5130"/><rect x="43" y="4" width="14" height="12" rx="2" fill="#1d2420"/><rect x="43" y="7" width="14" height="3" fill="#e7a83e"/></svg>`,
  board: `<svg viewBox="0 0 110 100"><rect x="12" y="14" width="86" height="58" rx="5" fill="#7a5130"/><rect x="18" y="20" width="74" height="46" rx="3" fill="#2f5546"/><path d="M28 36q8-8 16 0t16 0" fill="none" stroke="#f6f1e7" stroke-width="3" stroke-linecap="round"/><path d="M28 50h34" stroke="#f6f1e7" stroke-width="3" stroke-linecap="round" opacity=".7"/><path d="M80 34l2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1z" fill="#e7a83e"/><path d="M40 72l-8 18M70 72l8 18" stroke="#7a5130" stroke-width="5" stroke-linecap="round"/><rect x="74" y="70" width="18" height="4" rx="2" fill="#f6f1e7"/></svg>`,
};

const TYPES = ["All", ...new Set(PROJECTS.map(p => p.type))];
let active = "All";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

$("chips").innerHTML = TYPES.map(t =>
  `<button class="chip" type="button" data-t="${esc(t)}" aria-pressed="${t === active}">${esc(t)}</button>`).join("");
$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  active = b.dataset.t;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.t === active));
  render();
});
$("q").addEventListener("input", render);
$("yr").textContent = new Date().getFullYear();

function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = PROJECTS.filter(p =>
    (active === "All" || p.type === active) &&
    (!q || [p.name, p.ar, p.desc, p.type].join(" ").toLowerCase().includes(q)));
  $("grid").innerHTML = list.map(p => `
    <article class="card">
      <a class="art" href="${p.url}" style="--bg:${p.bg}" aria-label="Open ${esc(p.name)}">
        <span class="tag">${esc(p.type)}</span>
        ${p.lang ? `<span class="lang">${esc(p.lang)}</span>` : ""}
        ${ICONS[p.icon] || ""}
      </a>
      <div class="body">
        <h2>${esc(p.name)}</h2>
        ${p.ar ? `<div class="ar">${esc(p.ar)}</div>` : ""}
        <p>${esc(p.desc)}</p>
        <div class="actions">
          <a class="btn go" href="${p.url}">Open</a>
          ${p.repo ? `<a class="btn" href="${code(p.repo)}">Code</a>` : ""}
        </div>
      </div>
    </article>`).join("");
  $("count").textContent = `${list.length} live project${list.length === 1 ? "" : "s"}`;
  $("empty").style.display = list.length ? "none" : "block";
}
render();
</script>
</body>
</html>
