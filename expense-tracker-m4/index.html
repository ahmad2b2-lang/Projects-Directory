<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Expenses">
<title>Expense Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    color-scheme: light only;
    --bg:#f6f8f7; --card:#ffffff; --ink:#17201c; --muted:#6b7772; --line:#e4e9e6;
    --brand:#0f9d74; --brand-soft:#e3f5ee; --brand-ink:#0b7356;
    --up:#d1495b; --down:#0f9d74; --save:#2f6fd6; --save-soft:#e6eefc;
    --radius:16px; --nav-h:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior-y:none}
  input,select,textarea{-webkit-user-select:text;user-select:text}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hidden{display:none!important}

  /* header */
  header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    display:flex;align-items:center;gap:10px}
  header h1{font-size:19px;margin:0;flex:1}
  .pill-btn{padding:7px 12px;border-radius:999px;background:var(--brand-soft);color:var(--brand-ink);font-size:14px;font-weight:600}
  .ghost-btn{padding:7px 10px;border-radius:999px;color:var(--muted);font-size:14px}

  main{padding:16px 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);max-width:560px;margin:0 auto}
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);border:1px solid var(--line);margin-bottom:14px}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:600}

  /* bottom nav */
  nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav.tabs button{flex:1;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:12px;color:var(--muted);font-weight:600}
  nav.tabs button .ic{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6}
  nav.tabs button.active{color:var(--brand-ink)}
  nav.tabs button.active .ic{filter:none;opacity:1}

  /* form */
  label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px}
  .field{margin-bottom:14px}
  input.in{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;color:var(--ink);outline:none}
  input.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .amount-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px}
  .amount-wrap:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .amount-wrap input{flex:1;border:0;outline:none;font-size:30px;font-weight:700;padding:12px 0;min-width:0;background:transparent;color:var(--ink)}
  .amount-wrap span{font-weight:700;color:var(--muted)}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .row2 input.in{min-width:0;-webkit-appearance:none;appearance:none;min-height:48px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip.save.on{background:var(--save);border-color:var(--save)}
  .primary{width:100%;padding:15px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:17px}
  .primary:disabled{opacity:.5}
  .hint{font-size:13px;color:var(--muted)}

  /* lists */
  .item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item .emo{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
  .item .mid{flex:1;min-width:0}
  .item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .amt{font-weight:700;white-space:nowrap}
  .item .del{color:var(--muted);font-size:18px;padding:4px 2px 4px 8px}

  /* summary */
  .seg{display:flex;background:#eaefec;border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;padding:9px;border-radius:10px;font-weight:600;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .period{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .period button{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:18px}
  .period button:disabled{opacity:.35}
  .period .lbl{font-weight:700;text-align:center}
  .big{font-size:34px;font-weight:800;letter-spacing:-.5px}
  .big small{font-size:16px;color:var(--muted);font-weight:700}
  .delta{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px}
  .delta.up{background:#fbe9ec;color:var(--up)} .delta.down{background:var(--brand-soft);color:var(--down)} .delta.flat{background:#eef1ef;color:var(--muted)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stat{background:var(--bg);border-radius:12px;padding:10px 12px}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600}
  .stat .v{font-size:17px;font-weight:700;margin-top:2px}
  .insights{margin:0;padding:0;list-style:none}
  .insights li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
  .insights li:first-child{border-top:0}
  .cat-row{margin-bottom:12px}
  .cat-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
  .cat-row .top b{font-weight:700}
  .bar{height:9px;background:#eef1ef;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:999px}
  .cols{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:6px}
  .cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .cols .c i{display:block;width:100%;max-width:34px;background:var(--brand);border-radius:5px 5px 2px 2px;min-height:2px}
  .cols .c i.zero{background:#e4e9e6}
  .cols .c i.today{background:var(--brand-ink)}
  .cols .c span{font-size:10.5px;color:var(--muted);margin-top:5px;height:13px}
  .cols.save .c i{background:var(--save)}
  .cols .c em{font-style:normal;font-size:10px;color:var(--muted);margin-bottom:3px;white-space:nowrap}
  .empty{color:var(--muted);text-align:center;padding:18px 0;font-size:15px}

  /* savings */
  .save-hero{background:linear-gradient(135deg,#2f6fd6,#4f8de8);color:#fff;border:0}
  .save-hero h2{color:rgba(255,255,255,.85)}
  .save-hero .big small{color:rgba(255,255,255,.8)}
  .save-hero .sub{margin-top:6px;font-size:14px;color:rgba(255,255,255,.9)}
  .outline-btn{width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--save);color:var(--save);font-weight:700;background:#fff}

  /* login */
  #login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:420px;margin:0 auto}
  #login img{width:72px;height:72px;border-radius:18px;margin-bottom:16px}
  #login h1{margin:0 0 6px;font-size:26px}
  #login p{margin:0 0 22px;color:var(--muted)}
  .err{color:var(--up);font-size:14px;min-height:20px;margin-top:10px}

  /* toast */
  #toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:20;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>

<!-- ===== Login (password only) ===== -->
<section id="login" class="hidden">
  <img src="icon-192.png" alt="">
  <h1>Expense Tracker</h1>
  <p>Enter your password to continue.</p>
  <form id="loginForm">
    <input class="in" id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <div style="height:12px"></div>
    <button class="primary" id="loginBtn">Unlock</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- ===== App ===== -->
<div id="app" class="hidden">
  <header>
    <h1 id="title">Add Expense</h1>
    <button class="pill-btn hidden" id="installBtn">⬇ Install</button>
    <button class="ghost-btn" id="logoutBtn">Lock</button>
  </header>

  <main>
    <!-- Module 1: Add Expense -->
    <section id="v-add" class="view">
      <form id="addForm" class="card" autocomplete="off">
        <div class="field">
          <label class="f" for="cost">Cost</label>
          <div class="amount-wrap">
            <input id="cost" type="text" inputmode="decimal" placeholder="0.00" required>
            <span>SAR</span>
          </div>
        </div>
        <div class="field">
          <label class="f" for="desc">Description</label>
          <input class="in" id="desc" type="text" placeholder="e.g. Lunch with friends" maxlength="120" required>
        </div>
        <div class="field">
          <label class="f">Category</label>
          <div class="chips" id="catChips"></div>
        </div>
        <div class="row2 field">
          <div><label class="f" for="date">Date</label><input class="in" id="date" type="date" required></div>
          <div><label class="f" for="time">Time</label><input class="in" id="time" type="time" required></div>
        </div>
        <div class="field">
          <label class="f" for="loc">Location</label>
          <input class="in" id="loc" type="text" placeholder="e.g. Al Nakheel Mall" list="locList" maxlength="80">
          <datalist id="locList"></datalist>
        </div>
        <button class="primary" id="saveBtn">Save expense</button>
      </form>

      <div class="card">
        <h2>Recent</h2>
        <div id="recent"><div class="loading">Loading…</div></div>
      </div>
    </section>

    <!-- Module 2: Expense Summary -->
    <section id="v-sum" class="view hidden">
      <div class="seg" id="modeSeg">
        <button data-mode="week" class="on">Weekly</button>
        <button data-mode="month">Monthly</button>
      </div>
      <div class="period">
        <button id="prevP" aria-label="Previous">‹</button>
        <div class="lbl" id="pLabel"></div>
        <button id="nextP" aria-label="Next">›</button>
      </div>
      <div id="sumBody"></div>
    </section>

    <!-- Module 3: Monthly Savings -->
    <section id="v-save" class="view hidden">
      <div class="period">
        <button id="prevS" aria-label="Previous month">‹</button>
        <div class="lbl" id="sLabel"></div>
        <button id="nextS" aria-label="Next month">›</button>
      </div>
      <div id="saveBody"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="add" class="active"><span class="ic">➕</span>Add</button>
    <button data-view="sum"><span class="ic">📊</span>Summary</button>
    <button data-view="save"><span class="ic">🏦</span>Savings</button>
  </nav>
</div>

<div id="toast"></div>

<script>
/* ================= Config ================= */
const SUPABASE_URL = 'https://bhfgwlkzkbwcwyoypwhy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_9YylflVQca-62NHsBKSTeA_GY896nj3';
const ADMIN_EMAIL  = 'admin@product-card-maker.app';   // your existing admin account
const TABLE = 'expenses';
const SAVINGS = 'Savings';

const CATEGORIES = [
  ['Food & Dining','🍽️'], ['Groceries','🛒'], ['Transport','⛽'], ['Bills','💡'],
  ['Shopping','🛍️'], ['Health','💊'], ['Family','👨‍👩‍👧'], ['Entertainment','🎬'],
  ['Education','📚'], ['Charity','🤲'], ['Other','📦'], [SAVINGS,'🏦']
];
const EMOJI = Object.fromEntries(CATEGORIES);

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let rows = [];               // all expenses, newest first
let loaded = false;

/* ================= Helpers ================= */
const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2,'0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = (d) => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -d.getDay()); // Sunday
const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const money = (v) => nf.format(v);
const short = (v) => v >= 1000 ? (v/1000).toFixed(v >= 10000 ? 0 : 1) + 'k' : nf0.format(v);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = (s) => { const d = parseD(s); return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`; };
const fmtTime = (t) => t ? t.slice(0,5) : '';

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}
const inRange = (r, a, b) => { const d = parseD(r.spent_on); return d >= a && d < b; };
const sum = (list) => list.reduce((s,r) => s + Number(r.cost), 0);
const spending = (list) => list.filter(r => r.category !== SAVINGS);
const savingsOf = (list) => list.filter(r => r.category === SAVINGS);

/* ================= Auth ================= */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  session ? showApp() : showLogin();
}
function showLogin(){ $('app').classList.add('hidden'); $('login').classList.remove('hidden'); setTimeout(() => $('pw').focus(), 50); }
function showApp(){ $('login').classList.add('hidden'); $('app').classList.remove('hidden'); resetForm(); loadData(); }

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password: $('pw').value });
  $('loginBtn').disabled = false;
  if (error) { $('loginErr').textContent = 'Wrong password, try again.'; return; }
  $('pw').value = ''; showApp();
});
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); rows = []; loaded = false; showLogin(); });

/* ================= Data ================= */
async function loadData(){
  const all = []; const page = 1000;
  for (let from = 0; ; from += page) {
    const { data, error } = await sb.from(TABLE).select('*')
      .order('spent_on', { ascending: false }).order('spent_at', { ascending: false }).order('id', { ascending: false })
      .range(from, from + page - 1);
    if (error) { toast('Could not load data'); console.error(error); if (error.code === 'PGRST301') showLogin(); return; }
    all.push(...data);
    if (data.length < page) break;
  }
  rows = all; loaded = true;
  renderAll();
}
function renderAll(){ renderRecent(); renderLocations(); renderSummary(); renderSavings(); }

/* ================= Tabs ================= */
const TITLES = { add: 'Add Expense', sum: 'Expense Summary', save: 'Monthly Savings' };
function go(view){
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('hidden', v.id !== 'v-' + view));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $('title').textContent = TITLES[view];
  window.scrollTo(0,0);
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));

/* ================= Module 1: Add ================= */
let selectedCat = 'Food & Dining';
function renderChips(){
  $('catChips').innerHTML = CATEGORIES.map(([n,e]) =>
    `<button type="button" class="chip ${n===SAVINGS?'save':''} ${n===selectedCat?'on':''}" data-cat="${esc(n)}">${e} ${esc(n)}</button>`).join('');
}
$('catChips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return;
  selectedCat = b.dataset.cat; renderChips();
  $('saveBtn').textContent = selectedCat === SAVINGS ? 'Save savings transfer' : 'Save expense';
});
function resetForm(keepCat){
  const n = new Date();
  $('cost').value = ''; $('desc').value = ''; $('loc').value = '';
  $('date').value = ymd(n); $('time').value = `${pad(n.getHours())}:${pad(n.getMinutes())}`;
  if (!keepCat) selectedCat = 'Food & Dining';
  renderChips();
  $('saveBtn').textContent = selectedCat === SAVINGS ? 'Save savings transfer' : 'Save expense';
}
$('cost').addEventListener('input', (e) => {
  // allow digits and one decimal point; convert Arabic-Indic digits
  let v = e.target.value.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^\d.]/g,'');
  const i = v.indexOf('.'); if (i >= 0) v = v.slice(0,i+1) + v.slice(i+1).replace(/\./g,'').slice(0,2);
  e.target.value = v;
});
$('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const cost = parseFloat($('cost').value);
  if (!(cost > 0)) { toast('Enter a cost above 0'); $('cost').focus(); return; }
  const rec = {
    description: $('desc').value.trim(), cost, currency: 'SAR', category: selectedCat,
    spent_on: $('date').value, spent_at: $('time').value, location: $('loc').value.trim() || null
  };
  if (!rec.description) { toast('Add a description'); return; }
  $('saveBtn').disabled = true;
  const { data, error } = await sb.from(TABLE).insert(rec).select().single();
  $('saveBtn').disabled = false;
  if (error) { console.error(error); toast(navigator.onLine ? 'Could not save — try again' : 'You are offline'); return; }
  rows.unshift(data);
  rows.sort((a,b) => (b.spent_on + b.spent_at).localeCompare(a.spent_on + a.spent_at) || b.id - a.id);
  toast(rec.category === SAVINGS ? `🏦 ${money(cost)} SAR saved` : `✓ ${money(cost)} SAR added`);
  resetForm(); renderAll();
});

function itemHTML(r, withDel){
  const meta = [fmtDate(r.spent_on) + ' · ' + fmtTime(r.spent_at), r.location].filter(Boolean).join(' · ');
  return `<div class="item">
    <div class="emo">${EMOJI[r.category] || '📦'}</div>
    <div class="mid"><div class="t">${esc(r.description)}</div><div class="s">${esc(r.category)} · ${esc(meta)}</div></div>
    <div class="amt" style="${r.category===SAVINGS?'color:var(--save)':''}">${money(r.cost)}</div>
    ${withDel ? `<button class="del" data-del="${r.id}" aria-label="Delete">×</button>` : ''}
  </div>`;
}
function renderRecent(){
  const list = rows.slice(0, 10);
  $('recent').innerHTML = list.length ? list.map(r => itemHTML(r, true)).join('') : '<div class="empty">No expenses yet — add your first one above.</div>';
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  const r = rows.find(x => x.id == b.dataset.del); if (!r) return;
  if (!confirm(`Delete "${r.description}" (${money(r.cost)} SAR)?`)) return;
  const { error } = await sb.from(TABLE).delete().eq('id', r.id);
  if (error) { toast('Could not delete'); return; }
  rows = rows.filter(x => x.id !== r.id); toast('Deleted'); renderAll();
});
function renderLocations(){
  const seen = [...new Set(rows.map(r => r.location).filter(Boolean))].slice(0, 30);
  $('locList').innerHTML = seen.map(l => `<option value="${esc(l)}">`).join('');
}

/* ================= Module 2: Summary ================= */
let mode = 'week';
let anchor = today();
function periodRange(m, a){
  if (m === 'week') { const s = startOfWeek(a); return [s, addDays(s, 7)]; }
  const s = startOfMonth(a); return [s, new Date(s.getFullYear(), s.getMonth()+1, 1)];
}
function shiftAnchor(m, a, dir){
  return m === 'week' ? addDays(a, 7*dir) : new Date(a.getFullYear(), a.getMonth()+dir, 1);
}
function periodLabel(m, s, e){
  if (m === 'month') return `${MONTHS[s.getMonth()]} ${s.getFullYear()}`;
  const l = addDays(e, -1);
  const a = `${s.getDate()} ${MONTHS[s.getMonth()].slice(0,3)}`, b = `${l.getDate()} ${MONTHS[l.getMonth()].slice(0,3)} ${l.getFullYear()}`;
  return `${a} – ${b}`;
}
$('modeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode; anchor = today();
  document.querySelectorAll('#modeSeg button').forEach(x => x.classList.toggle('on', x === b));
  renderSummary();
});
$('prevP').addEventListener('click', () => { anchor = shiftAnchor(mode, anchor, -1); renderSummary(); });
$('nextP').addEventListener('click', () => { anchor = shiftAnchor(mode, anchor, 1); renderSummary(); });

function renderSummary(){
  const [s, e] = periodRange(mode, anchor);
  const [ps, pe] = periodRange(mode, shiftAnchor(mode, anchor, -1));
  $('pLabel').textContent = periodLabel(mode, s, e);
  const t = today();
  $('nextP').disabled = e > t;
  if (!loaded) { $('sumBody').innerHTML = '<div class="loading">Loading…</div>'; return; }

  const cur = spending(rows.filter(r => inRange(r, s, e)));
  const prev = spending(rows.filter(r => inRange(r, ps, pe)));
  const total = sum(cur), ptotal = sum(prev);
  const isCurrent = s <= t && t < e;
  const daysElapsed = isCurrent ? Math.round((t - s) / 864e5) + 1 : Math.round((e - s) / 864e5);
  const avg = total / daysElapsed;
  const unit = mode === 'week' ? 'week' : 'month';

  // delta vs previous period (compare like-for-like if current period is in progress)
  let deltaHTML = '';
  let cmpPrev = ptotal, cmpNote = `vs last ${unit}`;
  if (isCurrent) {
    const cut = addDays(ps, daysElapsed);
    cmpPrev = sum(prev.filter(r => parseD(r.spent_on) < cut));
    cmpNote = `vs same point last ${unit}`;
  }
  if (cmpPrev > 0) {
    const pct = (total - cmpPrev) / cmpPrev * 100;
    const cls = Math.abs(pct) < 1 ? 'flat' : pct > 0 ? 'up' : 'down';
    deltaHTML = `<span class="delta ${cls}">${pct > 0 ? '▲' : pct < 0 ? '▼' : '•'} ${Math.abs(pct).toFixed(0)}% ${cmpNote}</span>`;
  } else if (total > 0) {
    deltaHTML = `<span class="delta flat">No spending last ${unit} to compare</span>`;
  }

  // categories
  const byCat = {};
  cur.forEach(r => byCat[r.category] = (byCat[r.category] || 0) + Number(r.cost));
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]);
  const prevCat = {};
  prev.forEach(r => prevCat[r.category] = (prevCat[r.category] || 0) + Number(r.cost));

  // daily columns
  const nDays = Math.round((e - s) / 864e5);
  const daily = Array.from({ length: nDays }, (_, i) => ({ d: addDays(s, i), v: 0 }));
  cur.forEach(r => { const i = Math.round((parseD(r.spent_on) - s) / 864e5); if (daily[i]) daily[i].v += Number(r.cost); });
  const maxD = Math.max(...daily.map(x => x.v), 1);

  // insights
  const ins = [];
  if (cur.length) {
    const [tc, tv] = cats[0];
    ins.push(['🏷️', `<b>${esc(tc)}</b> took the biggest share: ${money(tv)} SAR (${(tv/total*100).toFixed(0)}% of spending).`]);
    const big = cur.reduce((a,b) => Number(b.cost) > Number(a.cost) ? b : a);
    ins.push(['💸', `Largest single expense: <b>${esc(big.description)}</b> — ${money(big.cost)} SAR on ${fmtDate(big.spent_on)}.`]);
    const peak = daily.reduce((a,b) => b.v > a.v ? b : a);
    if (peak.v > 0) ins.push(['📅', `Your heaviest day was <b>${DAYS[peak.d.getDay()]} ${peak.d.getDate()} ${MONTHS[peak.d.getMonth()].slice(0,3)}</b> with ${money(peak.v)} SAR.`]);
    const noSpend = daily.filter(x => x.d <= t && x.v === 0).length;
    if (noSpend) ins.push(['🌿', `${noSpend} no-spend day${noSpend>1?'s':''} this ${unit}.`]);
    // weekend vs weekday (Fri & Sat)
    if (mode === 'month') {
      const wk = cur.filter(r => [5,6].includes(parseD(r.spent_on).getDay()));
      const share = sum(wk) / total * 100;
      if (wk.length) ins.push(['🛋️', `Weekends (Fri–Sat) made up ${share.toFixed(0)}% of this month's spending.`]);
    }
    // biggest category change
    let best = null;
    for (const c of new Set([...Object.keys(byCat), ...Object.keys(prevCat)])) {
      const diff = (byCat[c]||0) - (prevCat[c]||0);
      if (!best || Math.abs(diff) > Math.abs(best[1])) best = [c, diff];
    }
    if (!isCurrent && best && ptotal > 0 && Math.abs(best[1]) >= 1) {
      ins.push([best[1] > 0 ? '📈' : '📉', `<b>${esc(best[0])}</b> ${best[1] > 0 ? 'rose' : 'dropped'} by ${money(Math.abs(best[1]))} SAR compared with last ${unit}.`]);
    }
    const small = cur.filter(r => Number(r.cost) < 20);
    if (small.length >= 3) ins.push(['☕', `${small.length} small purchases under 20 SAR added up to ${money(sum(small))} SAR.`]);
    if (isCurrent && mode === 'month') {
      const proj = avg * nDays;
      ins.push(['🔮', `At this pace you'll spend about <b>${money(proj)} SAR</b> by the end of ${MONTHS[s.getMonth()]}.`]);
    }
  }

  const colLabel = (x, i) => mode === 'week' ? DAYS[x.d.getDay()].slice(0,2)
    : ((i === 0 || (i+1) % 5 === 0) ? x.d.getDate() : '');

  $('sumBody').innerHTML = `
    <div class="card">
      <h2>Total spent</h2>
      <div class="big">${money(total)} <small>SAR</small></div>
      ${deltaHTML}
      <div class="stats">
        <div class="stat"><div class="k">Daily average</div><div class="v">${money(avg)}</div></div>
        <div class="stat"><div class="k">Transactions</div><div class="v">${cur.length}</div></div>
      </div>
    </div>
    <div class="card">
      <h2>${mode === 'week' ? 'Day by day' : 'Daily spending'}</h2>
      <div class="cols">${daily.map((x,i) => `
        <div class="c">${mode==='week' && x.v ? `<em>${short(x.v)}</em>` : ''}
          <i class="${x.v ? '' : 'zero'} ${ymd(x.d)===ymd(t)?'today':''}" style="height:${x.v ? Math.max(x.v/maxD*100, 3) : 2}%"></i>
          <span>${colLabel(x,i)}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Insights</h2>
      ${ins.length ? `<ul class="insights">${ins.map(([e,t]) => `<li><span>${e}</span><span>${t}</span></li>`).join('')}</ul>`
        : `<div class="empty">No spending recorded in this ${unit}.</div>`}
    </div>
    ${cats.length ? `<div class="card">
      <h2>By category</h2>
      ${cats.map(([c,v]) => `<div class="cat-row">
        <div class="top"><span>${EMOJI[c]||'📦'} ${esc(c)}</span><b>${money(v)}</b></div>
        <div class="bar"><i style="width:${v/cats[0][1]*100}%"></i></div></div>`).join('')}
    </div>` : ''}
    ${cur.length ? `<div class="card"><h2>All expenses this ${unit}</h2>${cur.map(r => itemHTML(r, false)).join('')}</div>` : ''}
  `;
}

/* ================= Module 3: Savings ================= */
let sMonth = startOfMonth(today());
$('prevS').addEventListener('click', () => { sMonth = new Date(sMonth.getFullYear(), sMonth.getMonth()-1, 1); renderSavings(); });
$('nextS').addEventListener('click', () => { sMonth = new Date(sMonth.getFullYear(), sMonth.getMonth()+1, 1); renderSavings(); });

function renderSavings(){
  const s = sMonth, e = new Date(s.getFullYear(), s.getMonth()+1, 1);
  $('sLabel').textContent = `${MONTHS[s.getMonth()]} ${s.getFullYear()}`;
  $('nextS').disabled = e > today();
  if (!loaded) { $('saveBody').innerHTML = '<div class="loading">Loading…</div>'; return; }

  const month = rows.filter(r => inRange(r, s, e));
  const sv = savingsOf(month), saved = sum(sv), spent = sum(spending(month));
  const out = saved + spent;
  const rate = out > 0 ? saved / out * 100 : 0;

  // last 6 months history
  const hist = [];
  for (let i = 5; i >= 0; i--) {
    const ms = new Date(s.getFullYear(), s.getMonth()-i, 1), me = new Date(ms.getFullYear(), ms.getMonth()+1, 1);
    hist.push({ ms, v: sum(savingsOf(rows.filter(r => inRange(r, ms, me)))) });
  }
  const maxH = Math.max(...hist.map(h => h.v), 1);
  const ys = new Date(s.getFullYear(), 0, 1);
  const ytd = sum(savingsOf(rows.filter(r => inRange(r, ys, e))));
  const prevM = hist[4].v;
  let cmp = '';
  if (prevM > 0) {
    const d = saved - prevM;
    cmp = d === 0 ? 'Same as last month.' : `${d > 0 ? '▲' : '▼'} ${money(Math.abs(d))} SAR ${d > 0 ? 'more' : 'less'} than last month.`;
  }

  $('saveBody').innerHTML = `
    <div class="card save-hero">
      <h2>Sent to savings</h2>
      <div class="big">${money(saved)} <small>SAR</small></div>
      <div class="sub">${sv.length ? `${sv.length} transfer${sv.length>1?'s':''}. ${cmp}` : 'No transfers recorded this month yet.'}</div>
    </div>
    <div class="card">
      <div class="stats" style="margin-top:0">
        <div class="stat"><div class="k">Spent this month</div><div class="v">${money(spent)}</div></div>
        <div class="stat"><div class="k">Savings rate</div><div class="v">${out ? rate.toFixed(0) + '%' : '—'}</div></div>
        <div class="stat"><div class="k">Saved in ${s.getFullYear()} so far</div><div class="v">${money(ytd)}</div></div>
        <div class="stat"><div class="k">6-month average</div><div class="v">${money(sum(hist.map(h => ({cost:h.v})))/6)}</div></div>
      </div>
      <p class="hint" style="margin:10px 0 0">Savings rate = share of the money that left your hands this month that went to savings.</p>
    </div>
    <div class="card">
      <h2>Last 6 months</h2>
      <div class="cols save">${hist.map((h,i) => `
        <div class="c">${h.v ? `<em>${short(h.v)}</em>` : ''}
          <i class="${h.v?'':'zero'}" style="height:${h.v ? Math.max(h.v/maxH*100,3) : 2}%;${i===5?'opacity:1':'opacity:.55'}"></i>
          <span>${MONTHS[h.ms.getMonth()].slice(0,3)}</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>Transfers</h2>
      ${sv.length ? sv.map(r => itemHTML(r, true)).join('') : '<div class="empty">Nothing here yet.</div>'}
      <div style="height:10px"></div>
      <button class="outline-btn" id="addSaving">＋ Record a savings transfer</button>
    </div>`;
  $('addSaving').onclick = () => { selectedCat = SAVINGS; resetForm(true); go('add'); $('cost').focus(); };
}

/* ================= PWA ================= */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; $('installBtn').classList.remove('hidden'); });
$('installBtn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('installBtn').classList.add('hidden');
});
window.addEventListener('appinstalled', () => $('installBtn').classList.add('hidden'));
// iPhone: no install prompt exists, show a hint once
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (isIOS && !standalone) {
  $('installBtn').classList.remove('hidden');
  $('installBtn').onclick = () => alert('To install: tap the Share button in Safari, then "Add to Home Screen".');
}
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
document.addEventListener('visibilitychange', () => { if (!document.hidden && loaded) loadData(); });
document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });

boot();
</script>
